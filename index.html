<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#eceefb;--panel:rgba(255,255,255,.65);--edge:rgba(255,255,255,.9);
  --key:rgba(255,255,255,.92);--key-h:#fff;--op:rgba(108,92,231,.14);--op-t:#5b45e0;
  --text:#1b1d3a;--muted:#6a6f99;--shadow:0 30px 60px -20px rgba(70,60,160,.35);
  --a:#6c7dff;--b:#b46cff;--c:#ff7ab6;--blob:.55;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f24;--panel:rgba(255,255,255,.06);--edge:rgba(255,255,255,.12);
  --key:rgba(255,255,255,.07);--key-h:rgba(255,255,255,.14);--op:rgba(124,140,255,.2);--op-t:#aab4ff;
  --text:#eef0ff;--muted:#9aa0c8;--shadow:0 40px 80px -20px rgba(0,0,0,.7);--blob:.5}}
:root[data-theme="dark"]{
  --bg:#0d0f24;--panel:rgba(255,255,255,.06);--edge:rgba(255,255,255,.12);
  --key:rgba(255,255,255,.07);--key-h:rgba(255,255,255,.14);--op:rgba(124,140,255,.2);--op-t:#aab4ff;
  --text:#eef0ff;--muted:#9aa0c8;--shadow:0 40px 80px -20px rgba(0,0,0,.7);--blob:.5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;position:relative}
.blob{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob);pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.b1{background:var(--a);top:-25vmax;left:-20vmax}
.b2{background:var(--c);bottom:-30vmax;right:-20vmax;animation-delay:-8s}
.b3{background:var(--b);width:40vmax;height:40vmax;top:30%;left:40%;animation-delay:-14s;opacity:calc(var(--blob) * .6)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.calc{position:relative;width:min(380px,100%);max-height:100%;background:var(--panel);border:1px solid var(--edge);border-radius:32px;padding:18px;backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);box-shadow:var(--shadow);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tools{display:flex;gap:6px}
.icon{width:36px;height:36px;border:0;border-radius:12px;background:var(--key);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
.icon:hover{background:var(--key-h);color:var(--text)}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.screen{min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 14px;gap:4px;text-align:right}
.expr{font-size:20px;color:var(--muted);min-height:26px;max-width:100%;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums;scrollbar-width:none}
.expr::-webkit-scrollbar{display:none}
.res{font-size:56px;font-weight:300;line-height:1.1;max-width:100%;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:font-size .15s}
.res.err{font-size:22px;font-weight:400;color:var(--c)}
.res.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.9);opacity:.3;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k{position:relative;overflow:hidden;height:64px;border:0;border-radius:22px;background:var(--key);color:var(--text);font:inherit;font-size:26px;font-weight:400;cursor:pointer;transition:transform .1s,background .15s,box-shadow .15s}
.k:hover{background:var(--key-h)}
.k:active{transform:scale(.94)}
.k:focus-visible,.icon:focus-visible,.h-item:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.k.op{background:var(--op);color:var(--op-t);font-size:28px}
.k.fn{color:var(--muted);font-size:22px}
.k.eq{background:linear-gradient(135deg,var(--a),var(--b) 55%,var(--c));color:#fff;box-shadow:0 10px 26px -8px var(--b)}
.k.eq:hover{box-shadow:0 14px 32px -6px var(--b);background:linear-gradient(135deg,var(--a),var(--b) 55%,var(--c))}
.k svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.hist{position:absolute;inset:0;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:inherit;padding:18px;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}
.hist.open{transform:none}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist-top h2{margin:0;font-size:18px;font-weight:500}
.h-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.h-item{border:0;background:var(--key);color:var(--text);font:inherit;text-align:right;border-radius:16px;padding:12px 14px;cursor:pointer}
.h-item:hover{background:var(--key-h)}
.h-item small{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.h-item b{font-weight:500;font-size:24px}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:220px}
@media (max-height:640px){.k{height:52px;font-size:22px}.screen{min-height:96px}.res{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main class="calc" aria-label="Calculator">
  <div class="top">
    <span class="brand">Prism</span>
    <div class="tools">
      <button class="icon" id="histBtn" aria-label="Show history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
      <button class="icon" id="themeBtn" aria-label="Switch theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="res" id="res">0</div>
  </div>

  <div class="pad" id="pad">
    <button class="k fn" data-k="AC">AC</button>
    <button class="k fn" data-k="()">( )</button>
    <button class="k fn" data-k="%">%</button>
    <button class="k op" data-k="÷" aria-label="Divide">÷</button>
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
    <button class="k op" data-k="×" aria-label="Multiply">×</button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
    <button class="k op" data-k="−" aria-label="Subtract">−</button>
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
    <button class="k op" data-k="+" aria-label="Add">+</button>
    <button class="k" data-k="0">0</button>
    <button class="k" data-k=".">.</button>
    <button class="k fn" data-k="DEL" aria-label="Delete last"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m13 9 4 6m0-6-4 6"/></svg></button>
    <button class="k eq" data-k="=" aria-label="Equals">=</button>
  </div>

  <section class="hist" id="hist" aria-label="History">
    <div class="hist-top">
      <h2>History</h2>
      <div class="tools">
        <button class="icon" id="clearHist" aria-label="Clear history"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <button class="icon" id="closeHist" aria-label="Close history"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="h-list" id="hList"></div>
  </section>
</main>

<script>
(function(){
  var expr='', justEq=false, history=[];
  var $=function(id){return document.getElementById(id)};
  var exprEl=$('expr'), resEl=$('res'), hist=$('hist'), hList=$('hList');
  var OPS='+−×÷';

  /* --- safe parser (no eval) --- */
  function evaluate(s){
    var i=0;
    function peek(){return s[i]}
    function num(){
      var st=i; while(i<s.length && /[0-9.]/.test(s[i])) i++;
      if(st===i) throw new Error('syntax');
      var v=parseFloat(s.slice(st,i)); if(isNaN(v)) throw new Error('syntax'); return v;
    }
    function primary(){
      if(peek()==='('){i++; var v=addsub(); if(peek()!==')') throw new Error('syntax'); i++; return v;}
      return num();
    }
    function factor(){
      if(peek()==='−'){i++; return -factor();}
      if(peek()==='+'){i++; return factor();}
      var v=primary(); while(peek()==='%'){i++; v/=100;} return v;
    }
    function muldiv(){
      var v=factor();
      while(peek()==='×'||peek()==='÷'){
        var o=s[i++], r=factor();
        if(o==='÷'){ if(r===0) throw new Error('div0'); v/=r; } else v*=r;
      } return v;
    }
    function addsub(){
      var v=muldiv();
      while(peek()==='+'||peek()==='−'){ var o=s[i++], r=muldiv(); v=o==='+'?v+r:v-r; }
      return v;
    }
    var out=addsub(); if(i<s.length) throw new Error('syntax'); return out;
  }
  function closeParens(s){
    var o=(s.match(/\(/g)||[]).length, c=(s.match(/\)/g)||[]).length;
    return s+')'.repeat(Math.max(0,o-c));
  }
  function fmt(n){
    if(!isFinite(n)) throw new Error('syntax');
    n=parseFloat(n.toPrecision(12));
    var a=Math.abs(n);
    if(a!==0 && (a>=1e15||a<1e-9)) return n.toExponential(6).replace(/\.?0+e/,'e').replace('e+','e');
    var parts=String(n).split('.');
    parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return parts.join('.');
  }
  function pretty(s){return s.replace(/([+−×÷])/g,' $1 ').replace(/\s+/g,' ').replace(/^ −/,'−').replace(/\( −/g,'(−').trim();}

  /* --- rendering --- */
  function sizeRes(){
    var l=resEl.textContent.length;
    resEl.style.fontSize=resEl.classList.contains('err')?'':(l>16?'28px':l>12?'36px':l>9?'44px':'');
  }
  function render(pop){
    exprEl.textContent=pretty(expr);
    exprEl.scrollLeft=exprEl.scrollWidth;
    resEl.classList.remove('err');
    var txt='0';
    if(expr){
      if(/[0-9)%]$/.test(expr)){
        try{ txt=fmt(evaluate(closeParens(expr))); }
        catch(e){ txt = e.message==='div0' ? (resEl.classList.add('err'),"Can't divide by zero") : (/^[0-9.]+$/.test(expr)? expr : '…'); }
      } else txt='…';
      if(/^[0-9.]+$/.test(expr)) txt=fmt(parseFloat(expr))+(expr.slice(-1)==='.'?'.':'');
    }
    resEl.textContent=txt; sizeRes();
    if(pop){resEl.classList.remove('pop'); void resEl.offsetWidth; resEl.classList.add('pop');}
  }

  /* --- input --- */
  function curNum(){var m=expr.match(/[0-9.]*$/); return m?m[0]:'';}
  function press(k){
    if(justEq){
      if(/[0-9.(]/.test(k)) expr='';
      justEq=false;
    }
    if(/^[0-9]$/.test(k)){
      if(/[)%]$/.test(expr)) expr+='×';
      if(curNum()==='0') expr=expr.slice(0,-1);
      expr+=k;
    } else if(k==='.'){
      if(/[)%]$/.test(expr)) expr+='×';
      var n=curNum(); if(n.indexOf('.')>-1) return;
      expr+= n===''?'0.':'.';
    } else if(OPS.indexOf(k)>-1){
      if(!expr){ if(k==='−') expr='−'; return; }
      if(expr==='−') return;
      if(/[(]$/.test(expr)){ if(k==='−') expr+=k; return; }
      if(OPS.indexOf(expr.slice(-1))>-1) expr=expr.slice(0,-1);
      expr+=k;
    } else if(k==='%'){
      if(/[0-9)%]$/.test(expr)) expr+='%';
    } else if(k==='()'){
      var o=(expr.match(/\(/g)||[]).length, c=(expr.match(/\)/g)||[]).length;
      if(!expr||/[(+−×÷]$/.test(expr)) expr+='(';
      else if(o>c) expr+=')';
      else expr+='×(';
    } else if(k==='DEL'){
      expr=expr.slice(0,-1);
    } else if(k==='AC'){
      expr='';
    } else if(k==='='){
      if(!expr) return;
      try{
        var r=fmt(evaluate(closeParens(expr)));
        addHistory(pretty(closeParens(expr)), r);
        expr=r.replace(/,/g,'').replace('-','−');
        justEq=true; render(true); return;
      }catch(e){
        render(false); return;
      }
    }
    render(false);
  }

  /* --- history --- */
  function addHistory(e,r){history.unshift({e:e,r:r}); if(history.length>30) history.pop(); drawHist();}
  function drawHist(){
    hList.innerHTML='';
    if(!history.length){var d=document.createElement('p'); d.className='empty'; d.textContent='Nothing here yet. Finished calculations show up here.'; hList.appendChild(d); return;}
    history.forEach(function(h){
      var b=document.createElement('button'); b.className='h-item';
      var s=document.createElement('small'); s.textContent=h.e+' =';
      var t=document.createElement('b'); t.textContent=h.r;
      b.appendChild(s); b.appendChild(t);
      b.onclick=function(){expr=h.r.replace(/,/g,'').replace('-','−'); justEq=true; render(true); hist.classList.remove('open');};
      hList.appendChild(b);
    });
  }
  $('histBtn').onclick=function(){hist.classList.add('open');};
  $('closeHist').onclick=function(){hist.classList.remove('open');};
  $('clearHist').onclick=function(){history=[]; drawHist();};

  /* --- keys, ripple, keyboard --- */
  $('pad').addEventListener('click',function(ev){
    var b=ev.target.closest('.k'); if(!b) return;
    var r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)/3, sp=document.createElement('span');
    sp.className='rip'; sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(ev.clientX-r.left-d/2)+'px;top:'+(ev.clientY-r.top-d/2)+'px';
    if(ev.clientX===0&&ev.clientY===0){sp.style.left=(r.width/2-d/2)+'px';sp.style.top=(r.height/2-d/2)+'px';}
    b.appendChild(sp); setTimeout(function(){sp.remove();},500);
    press(b.getAttribute('data-k'));
  });
  var map={'*':'×','/':'÷','-':'−','Enter':'=','=':'=','Backspace':'DEL','Escape':'AC','(':'()',')':'()'};
  document.addEventListener('keydown',function(ev){
    if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
    if(ev.key==='Escape' && hist.classList.contains('open')){hist.classList.remove('open'); return;}
    var k=map[ev.key]||ev.key;
    if(/^[0-9.+%]$/.test(k)||'×÷−=DEL AC ()'.split(' ').concat(['×','÷','−','=']).indexOf(k)>-1){
      if(ev.key==='Enter'&&document.activeElement&&document.activeElement.classList.contains('k')) return;
      ev.preventDefault(); press(k);
      var el=document.querySelector('.k[data-k="'+k+'"]');
      if(el){el.style.transform='scale(.94)'; setTimeout(function(){el.style.transform='';},90);}
    }
  });

  /* --- theme --- */
  var root=document.documentElement;
  function savedTheme(){try{return localStorage.getItem('prism-theme');}catch(e){return null;}}
  var t=savedTheme(); if(t) root.setAttribute('data-theme',t);
  $('themeBtn').onclick=function(){
    var dark=root.getAttribute('data-theme')? root.getAttribute('data-theme')==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var n=dark?'light':'dark'; root.setAttribute('data-theme',n);
    try{localStorage.setItem('prism-theme',n);}catch(e){}
  };

  drawHist(); render(false);
})();
</script>
</body>
</html>
